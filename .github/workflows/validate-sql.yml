name: Validar Scripts SQL (Calidad y Ejecución)

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Análisis estático de estándares y buenas prácticas
  lint-sql:
    name: Analizar Estándares (SQLFluff)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del PR
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar SQLFluff
        run: |
          pip install --upgrade pip
          pip install sqlfluff sqlfluff-templater-dbt

      - name: Ejecutar linter con anotaciones en GitHub
        run: |
          sqlfluff lint scripts/ --dialect tsql --format github-annotation-native

  # Job 2: Prueba funcional levantando SQL Server (Solo corre si el lint pasa)
  validate-sql:
    name: Probar Ejecución en SQL Server
    needs: lint-sql
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'PasswordProfesor123!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PasswordProfesor123!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código del PR
        uses: actions/checkout@v4

      - name: Instalar sqlcmd (mssql-tools18)
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Crear BD de prueba y Ejecutar scripts .sql
        run: |
          set -e  # Falla el paso si cualquier comando interno retorna error

          # 1. Crear base de datos por defecto (fallback)
          sqlcmd -S localhost -U sa -P 'PasswordProfesor123!' -C -Q "CREATE DATABASE TestDB;"

          # 2. Guardar la lista de archivos ordenados en un arreglo de Bash
          mapfile -t files < <(find scripts -type f -name "*.sql" | sort -V)

          # 3. Ejecutar archivo por archivo en la sesión principal
          for file in "${files[@]}"; do
            echo "--------------------------------------------------"
            echo "Ejecutando: $file"
            echo "--------------------------------------------------"
            
            # -b asegura que sqlcmd devuelva un exit code de error si T-SQL falla
            sqlcmd -S localhost -U sa -P 'PasswordProfesor123!' -C -d TestDB -b -i "$file"
          done
