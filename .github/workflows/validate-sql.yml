name: Validar Scripts SQL (Calidad y Ejecución)

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened]
    paths:
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ejecutar-validacion:
    uses: yunenrr/IF0010-2026-Validadores-SQL/.github/workflows/motor-validacion-SQL.yml@main
